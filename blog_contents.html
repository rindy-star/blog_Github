        /* 카드 디자인 핵심 */
        .card { border: none; border-radius: 16px; transition: transform 0.3s ease, box-shadow 0.3s ease; overflow: hidden; height: 100%; }

        .card-title { font-size: 1.25rem; font-weight: 700; line-height: 1.4; margin: 15px 0; min-height: 3.5rem; }
        .card-text { color: #666; font-size: 0.95rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .card-top { height:50px }
